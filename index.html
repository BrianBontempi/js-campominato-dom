<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campo Minato</title>
    <!-- ! font awesome -->
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css' integrity='sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==' crossorigin='anonymous'/>
    <!-- ! boostrap -->
    <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css' integrity='sha512-b2QcS5SsA8tZodcDtGRELiGv5SaKSk1vDHDaQRda0htPYWZ6046lr3kJ5bAAQdpV2mmA/4v0wQF9MyU6/pDIAg==' crossorigin='anonymous'/>
    <!-- ! my css -->
    <link rel="stylesheet" href="css/style.css">
    <!-- ! javascript -->
    <script defer src="js/script.js"></script>
</head>
<body>
    <header class="d-flex justify-content-between align-item-center p-3">
        <h1>Campo Minato</h1>
        <h2 id="score" class="m-0"></h2>
        <div class="d-flex gap-3">
            <!-- ! select della difficoltà -->
            <select id="difficulty" class="form-select">
                <option value="easy" selected>Facile (10x10)</option>
                <option value="medium">Media (9x9)</option>
                <option value="hard">Difficile (7x7)</option>
            </select>
            <button class="btn btn-primary px-5 py-2">Play</button>
        </div>
    </header>
    <div class="container">
        <!-- ! messaggio di fine partita -->
        <h3 id="message" class="text-center mt-3"></h3>
        <div id="grid" class="d-flex flex-wrap justify-content-center align-item-center">
        </div>

    </div>
    
</body>
</html>
